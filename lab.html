<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KhwayGame Lab</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #e2d9cb;
        color: #4a443c;
        font: 15px/1.6 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.7;
      }
      #controls,
      #output {
        margin-bottom: 1.5rem;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.25rem;
      }
      #controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      #band {
        font: inherit;
      }
      #resetView {
        font: inherit;
      }
      canvas {
        cursor: grab;
        touch-action: none;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      #warpValue,
      #tabSizeValue,
      #tabVarianceValue,
      #gapValue,
      #zoomValue {
        min-width: 2.5rem;
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      #controls input[type='range'] {
        width: 7rem;
      }
      #readout {
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      canvas {
        display: block;
        background: #cfc5b4;
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);
      }
    </style>
  </head>
  <body>
    <h1>Puzzle cut lab</h1>
    <p>Standalone dev harness. Imports core only, never the game UI.</p>

    <div id="controls">
      <label>Image <input id="file" type="file" accept="image/*" /></label>
      <label>Size <select id="band"></select></label>
      <label>Warp <input id="warp" type="range" min="0" max="40" step="1" value="12" /><span id="warpValue"></span></label>
      <label>Tabs <input id="tabSize" type="range" min="0" max="150" step="5" value="100" /><span id="tabSizeValue"></span></label>
      <label>Variance <input id="tabVariance" type="range" min="0" max="50" step="5" value="15" /><span id="tabVarianceValue"></span></label>
      <label>Gap <input id="gap" type="range" min="0" max="20" step="1" value="5" /><span id="gapValue"></span></label>
      <label><input id="print" type="checkbox" checked /> Print treatment</label>
      <button id="resetView" type="button">Reset view</button>
      <span id="zoomValue"></span>
      <span id="readout"></span>
    </div>
    <div id="output"><canvas id="canvas"></canvas></div>

    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
