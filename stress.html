<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KhwayGame Stress Test</title>
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ede6da;
    }
    canvas {
      display: block;
    }
    /* createApp passes resizeTo: container, and Pixi reads that div's clientWidth and clientHeight.
      A bare div is full width and ZERO height, giving a 1900x0 canvas and a blank page in step 8. */
    #canvas {
      width: 100%;
      height: 100%;
    }
    /* #canvas fills the viewport, so the readout must float over it or it gets pushed off screen. */
    #readout {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1;
      font: 13px monospace;
    }
    /* harness.ts's renderPanel writes newline separated text into this, pre keeps those newlines visible
       instead of collapsing them, which is what a bare textContent assignment would otherwise do. */
    #harness {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 1;
      font: 13px monospace;
      white-space: pre;
      text-align: right;
    }
    </style>
  </head>
  <body>
    <div id="canvas"></div>
    <div id="readout"></div>
    <div id="harness"></div>
    <script type="module" src="/src/stress/main.ts"></script>
  </body>
</html>
